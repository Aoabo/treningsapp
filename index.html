<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#fff8ec" />
  <title>Treningsapp</title>
  <link rel="icon" type="image/jpeg" href="icon-512.jpg" />
  <link rel="apple-touch-icon" href="icon-512.jpg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- Innloggingsskjerm -->
    <div id="login-screen" class="screen">
      <div class="login-content">
        <img class="login-hero" src="hero.jpg" alt="Treningsapp" />
        <h1>Treningsapp</h1>
        <p>Logg inn med Google-kontoen din for å starte</p>
        <button id="login-btn" class="btn-primary">Logg inn med Google</button>
      </div>
    </div>

    <!-- Hovedskjerm -->
    <div id="main-screen" class="screen hidden">
      <header class="app-header">
        <button id="back-btn" class="back-btn hidden">←</button>
        <h1 id="page-title">Øvelser</h1>
        <button id="logout-btn" class="logout-btn">Logg ut</button>
      </header>

      <main id="content">
        <div class="loading">Laster inn...</div>
      </main>

      <nav class="bottom-nav">
        <button class="nav-btn active" data-view="exercises">
          <span class="nav-icon">📋</span>
          <span class="nav-label">Øvelser</span>
        </button>
        <button class="nav-btn" data-view="history">
          <span class="nav-icon">📊</span>
          <span class="nav-label">Historikk</span>
        </button>
      </nav>
    </div>

  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
   <script src="https://apis.google.com/js/api.js" async 
  defer></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
